name: travel_desk
description: Private quoting assistant for travel agency owners.
publish_to: "none"
version: 2.1.0+4

environment:
  sdk: ">=3.8.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_secure_storage: ^9.2.4
  crypto: ^3.0.6
  cryptography: ^2.7.0
  supabase: ^2.6.0
  http: ^1.4.0
  intl: ^0.20.2
  url_launcher: ^6.3.1
  flutter_edge_ai: ">=2.5.1 <3.0.0"
  flutter_edge_ai_litertlm: ">=1.18.0 <2.0.0"
  flutter_tts: ^4.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
